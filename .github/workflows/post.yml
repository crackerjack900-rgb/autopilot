name: Post next clip

on:
  schedule:
    # 01:17 UTC daily = 5:17pm Pacific (winter) / 6:17pm (summer). Add more lines for more posts/day.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      backend:
        description: "Override backend (tiktok, zernio, upload_post, dry_run)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: clip-queue
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CLIPBOT_STORAGE: github
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      CLIPBOT_BACKEND: ${{ inputs.backend || vars.CLIPBOT_BACKEND }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q requests
      - name: Post
        id: post
        run: python -m clipbot post
      - name: Save queue
        if: always()
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || (git commit -m "queue: post" && git pull --rebase && git push)
      - name: Warn when the queue is low
        if: always() && steps.post.outputs.low_queue == 'true'
        env:
          READY: ${{ steps.post.outputs.ready }}
        run: |
          open=$(gh issue list --state open --search "Clip queue running low in:title" --json number --jq length)
          if [ "$open" = "0" ]; then
            gh issue create --title "Clip queue running low" \
              --body "Only ${READY} clips left to post. Open a new issue with a video URL to refill the queue."
          fi
