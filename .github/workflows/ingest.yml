name: Make clips from a URL

# Three ways to feed it a video:
#  1. Open an issue whose title or body contains the URL (works from the GitHub mobile app)
#  2. Actions tab -> "Make clips from a URL" -> Run workflow -> paste URL
#  3. Add a line to urls.txt and commit
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL (or any label when using a file on the Mac)"
        required: true
      local_path:
        description: "Optional: a video file already on the Mac (e.g. from Auto Downloads) - skips downloading"
        required: false
      creator:
        description: "Creator name for the credit line (optional)"
        required: false
      permission:
        description: "Permission note, e.g. 'licensed via email 2026-11-09' (optional)"
        required: false
      max_minutes:
        description: "Only use the first N minutes (optional, e.g. 30)"
        required: false
      clip_seconds:
        description: "Clip length range for this run, e.g. 60-120 (optional)"
        required: false
      force:
        description: "Re-clip a video that was already processed (true/false)"
        required: false
        default: "false"
  push:
    paths: [urls.txt]

permissions:
  contents: write
  issues: write

concurrency:
  group: clip-queue
  cancel-in-progress: false

jobs:
  ingest:
    # issues: only react to issues opened by the repo owner
    if: github.event_name != 'issues' || github.event.issue.user.login == github.repository_owner
    # YouTube blocks GitHub's own servers, so clip-making runs on your Mac (a self-hosted runner)
    # by default. Set repo variable INGEST_RUNNER=ubuntu-latest to go back to GitHub's servers.
    runs-on: ${{ vars.INGEST_RUNNER || 'self-hosted' }}
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      CLIPBOT_STORAGE: github
      CLIPBOT_WORK: ${{ github.workspace }}/../clipbot-work
      YTDLP_COOKIES_FILE: ${{ github.workspace }}/../clipbot-cookies.txt
    steps:
      - uses: actions/checkout@v4

      # --- GitHub's Linux servers ---
      - if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: runner.os == 'Linux'
        name: JavaScript runtime for yt-dlp (YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: runner.os == 'Linux'
        name: Install ffmpeg + Python deps (Linux)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      # --- Your Mac ---
      - if: runner.os == 'macOS'
        name: Install ffmpeg + Python deps (Mac)
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          for t in ffmpeg deno gh python@3.12; do brew list --versions "$t" >/dev/null 2>&1 || brew install "$t"; done
          PY="$(brew --prefix python@3.12)/bin/python3.12"
          [ -x "$HOME/.clipbot-venv/bin/python" ] || "$PY" -m venv "$HOME/.clipbot-venv"
          "$HOME/.clipbot-venv/bin/pip" install -q -U -r requirements.txt
          echo "$HOME/.clipbot-venv/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - if: runner.os == 'Linux'
        name: Cache whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.json') }}
      - name: Optional YouTube cookies
        env:
          COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: printf '%s' "$COOKIES" > "$YTDLP_COOKIES_FILE"

      - name: Make clips (issue)
        if: github.event_name == 'issues'
        id: issue
        env:
          TEXT: "${{ github.event.issue.title }}\n${{ github.event.issue.body }}"
        run: python -m clipbot ingest-text "$TEXT"
      - name: Make clips (manual run)
        if: github.event_name == 'workflow_dispatch'
        id: manual
        env:
          URL: ${{ inputs.url }}
          CREATOR: ${{ inputs.creator }}
          PERMISSION: ${{ inputs.permission }}
          MAXMIN: ${{ inputs.max_minutes }}
          LOCALPATH: ${{ inputs.local_path }}
          CLIPSEC: ${{ inputs.clip_seconds }}
          FORCE: ${{ inputs.force }}
        run: |
          LEN=()
          if [ "$FORCE" = "true" ]; then LEN+=(--force); fi
          if [ -n "$CLIPSEC" ]; then LEN=(--min-seconds "${CLIPSEC%-*}" --max-seconds "${CLIPSEC#*-}"); fi
          python -m clipbot ingest "$URL" ${CREATOR:+--creator "$CREATOR"} ${PERMISSION:+--permission "$PERMISSION"} ${MAXMIN:+--max-minutes "$MAXMIN"} ${LOCALPATH:+--local-file "$LOCALPATH"} "${LEN[@]}"
      - name: Make clips (urls.txt)
        if: github.event_name == 'push'
        run: python -m clipbot ingest-file urls.txt

      - name: Save queue
        if: always()
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          git add queue.json || true
          git diff --cached --quiet || (git commit -m "queue: add clips" && git pull --rebase && git push)

      - name: Delete downloaded videos and work files
        # kept after a failed run so a re-run skips the download and transcription
        if: success()
        run: rm -rf "$CLIPBOT_WORK" "$YTDLP_COOKIES_FILE"

      - name: Report back on the issue
        if: always() && github.event_name == 'issues'
        env:
          N: ${{ steps.issue.outputs.added }}
          ERR: ${{ steps.issue.outputs.errors }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.issue.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            gh issue comment "$ISSUE" --body "Queued ${N:-0} clips. They'll post on the daily schedule. ${ERR:+Problems: $ERR}"
            gh issue close "$ISSUE"
          else
            gh issue comment "$ISSUE" --body "Couldn't make clips from this link. ${ERR} See the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
